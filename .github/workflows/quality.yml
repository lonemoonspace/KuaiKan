# The full gate from AGENTS.md, run on every push and pull request.
#
# It exists because the gate was previously manual: nothing noticed that the
# published `.output/` artifact had drifted two versions behind the source, or
# that a `.test.tsx` file would silently never run.
name: quality

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # AGENTS.md requires the version to be bumped in three places at once; a
      # release that only edits package.json ships a manifest whose version
      # disagrees with the lockfile. Cheap to check here, invisible otherwise.
      - name: Version sync
        run: |
          node -e '
            const pkg = require("./package.json");
            const lock = require("./package-lock.json");
            const versions = [pkg.version, lock.version, lock.packages?.[""]?.version];
            if (versions.some((version) => version !== pkg.version)) {
              console.error(`version mismatch: package.json=${pkg.version} lock=${lock.version} lock.packages[""]=${lock.packages?.[""]?.version}`);
              process.exit(1);
            }
            console.log(`version ${pkg.version} is in sync`);
          '

      - name: Type-check
        run: npm run compile

      - name: Test
        run: npm run test

      - name: Lint
        run: npm run lint
